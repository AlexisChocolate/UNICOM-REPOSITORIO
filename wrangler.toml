name = "unicom-api"
main = "api/worker.js"
compatibility_date = "2026-11-19"
workers_dev = true

[vars]
ORIGENES_PERMITIDOS = "https://alexischocolate.github.io,http://localhost:8000,http://127.0.0.1:8000"

[[durable_objects.bindings]]
name = "VENTANILLA"
class_name = "VentanillaUnica"

# En el plan gratuito, los Durable Objects solo existen con almacenamiento SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VentanillaUnica"]

[[d1_databases]]
binding = "BASE"
database_name = "unicom"
database_id = "87d3855c-c9d9-4c6c-abad-cd7fb38cef0f"

# Fotos (nombradas por su huella) y volcados para los auditores.
[[r2_buckets]]
binding = "ARCHIVOS"
bucket_name = "unicom-archivos"

# Publica una raíz cada 10 minutos, solo si el cuaderno creció (Paso 9).
[triggers]
crons = ["*/10 * * * *"]
