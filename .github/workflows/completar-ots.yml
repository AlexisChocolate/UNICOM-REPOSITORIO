name: completar-ots

# Unas horas después de sellar, el calendario de OpenTimestamps ya tiene el bloque de Bitcoin:
# "ots upgrade" lo agrega al archivo .ots, que deja de estar pendiente.
on:
  schedule:
    - cron: "43 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escribe-en-el-repositorio
  cancel-in-progress: false

jobs:
  completar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opentimestamps-client
      - name: Completar sellos pendientes
        run: |
          shopt -s nullglob
          for sello in raices/*.ots; do
            ots upgrade "$sello" || echo "$sello sigue pendiente"
          done
          rm -f raices/*.ots.bak
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raices
          if git diff --cached --quiet; then
            echo "Ningún sello cambió."
            exit 0
          fi
          git commit -m "Completa sellos de OpenTimestamps con su bloque de Bitcoin"
          git pull --rebase
          git push
