name: publicar-raiz

# El "periódico" y el notario (Paso 9): copia al repositorio las raíces nuevas que firmó el servidor
# y pide su sello de tiempo en Bitcoin con el cliente oficial de OpenTimestamps.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escribe-en-el-repositorio
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Copiar raíces nuevas (verifica la cadena y que no cambie ninguna ya publicada)
        run: node auditor/publicar-raices.js --carpeta raices > nuevas.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opentimestamps-client
      - name: Sellar cada raíz nueva en Bitcoin
        run: |
          while read -r archivo; do
            [ -n "$archivo" ] && ots stamp "$archivo"
          done < nuevas.txt
      - name: Guardar en el repositorio
        run: |
          rm -f nuevas.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raices
          if git diff --cached --quiet; then
            echo "No hay raíces nuevas."
            exit 0
          fi
          git commit -m "Publica raíces nuevas y pide su sello en Bitcoin"
          git pull --rebase
          git push
